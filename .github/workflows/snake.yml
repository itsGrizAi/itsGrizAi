name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#a78bfa
            dist/github-snake-light.svg?palette=github-light&color_snake=#7c3aed
            dist/github-snake.gif?color_snake=#22d3ee&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#a78bfa

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
