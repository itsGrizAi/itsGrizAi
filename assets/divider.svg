<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#30363d"/>
      <stop offset="0.8" stop-color="#30363d"/>
      <stop offset="1"   stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1"   stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="17.5" width="1200" height="1" fill="url(#base)"/>
  <g>
    <rect x="-260" y="16.5" width="260" height="3" rx="1.5" fill="url(#beam)" filter="url(#g)">
      <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-260" y="17" width="260" height="2" rx="1" fill="url(#beam)">
      <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(600 18)">
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="-2" y="-2" width="4" height="4" transform="rotate(45)" fill="#22d3ee">
      <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
