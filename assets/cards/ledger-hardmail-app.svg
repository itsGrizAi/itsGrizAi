<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="ledger-hardmail-app: A Ledger hardware-wallet app written in C: real UI flows on real signing hardware, vibe-coded down to the metal.">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sheen { animation: sheen 7s ease-in-out 6s infinite; }
      @keyframes sheen { 0%, 60% { transform: translateX(-300px); } 100% { transform: translateX(900px); } }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
    </style>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="card"><rect width="560" height="150" rx="14"/></clipPath>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="560" height="150" fill="#0d1117"/>
    <circle class="pulse" cx="520" cy="10" r="90" fill="#7c3aed" opacity=".5" filter="url(#blur)"/>
    <rect class="sheen" x="0" y="-40" width="70" height="230" fill="#ffffff" opacity=".04" transform="skewX(-20)"/>
  </g>
  <rect x=".5" y=".5" width="559" height="149" rx="14" fill="none" stroke="#30363d"/>
  <rect x="16" y="0" width="528" height="2" fill="url(#acc)" opacity=".9"/>

  <rect x="22" y="22" width="40" height="40" rx="11" fill="#161b22" stroke="#30363d"/>
  <text class="mono" x="42" y="48" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle" filter="url(#glow)">::</text>

  <text class="mono" x="76" y="44" font-size="19" font-weight="700" fill="#e6edf3">ledger-hardmail-app</text>
  <text class="mono" x="76" y="60" font-size="11" fill="#6e7681" letter-spacing="1">itsGrizAi / ledger-hardmail-app</text>
  <text class="mono" x="538" y="36" font-size="11" fill="#6e7681" text-anchor="end" letter-spacing="1">// vibe-coded</text>

  <text class="sans" x="22" y="86" font-size="13.5" fill="#9da7b3">A Ledger hardware-wallet app written in C: real UI flows on</text>
  <text class="sans" x="22" y="105" font-size="13.5" fill="#9da7b3">real signing hardware, vibe-coded down to the metal.</text>
  
    <g>
      <rect x="22" y="116" width="41" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="36" cy="128" r="3.5" fill="#9ca3af"/>
      <text class="mono" x="46" y="132" font-size="12" font-weight="600" fill="#c9d1d9" textLength="7" lengthAdjust="spacingAndGlyphs">C</text>
    </g>
    <g>
      <rect x="71" y="116" width="77" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="85" cy="128" r="3.5" fill="#a78bfa"/>
      <text class="mono" x="95" y="132" font-size="12" font-weight="600" fill="#c9d1d9" textLength="43" lengthAdjust="spacingAndGlyphs">Ledger</text>
    </g>
    <g>
      <rect x="156" y="116" width="92" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="170" cy="128" r="3.5" fill="#22d3ee"/>
      <text class="mono" x="180" y="132" font-size="12" font-weight="600" fill="#c9d1d9" textLength="58" lengthAdjust="spacingAndGlyphs">embedded</text>
    </g>
</svg>
