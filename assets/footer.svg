<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="thanks for stopping by">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .up { opacity: 0; transform: translateY(10px); animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes up { to { opacity: 1; transform: translateY(0); } }
    </style>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="170" rx="18"/></clipPath>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="170" fill="#0d1117"/>
    <path fill="url(#w1)" opacity=".75">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,118 C200,72 400,164 600,118 C800,72 1000,164 1200,118 L1200,170 L0,170 Z;
                M0,118 C200,164 400,72 600,118 C800,164 1000,72 1200,118 L1200,170 L0,170 Z;
                M0,118 C200,72 400,164 600,118 C800,72 1000,164 1200,118 L1200,170 L0,170 Z"/>
    </path>
    <path fill="url(#w2)" opacity=".6">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0,134 C300,94 500,174 700,134 C900,94 1050,170 1200,134 L1200,170 L0,170 Z;
                M0,134 C300,174 500,94 700,134 C900,174 1050,98 1200,134 L1200,170 L0,170 Z;
                M0,134 C300,94 500,174 700,134 C900,94 1050,170 1200,134 L1200,170 L0,170 Z"/>
    </path>
    <path fill="#0d1117" opacity=".55">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M0,150 C250,130 450,170 650,150 C850,130 1000,168 1200,150 L1200,170 L0,170 Z;
                M0,150 C250,170 450,130 650,150 C850,170 1000,132 1200,150 L1200,170 L0,170 Z;
                M0,150 C250,130 450,170 650,150 C850,130 1000,168 1200,150 L1200,170 L0,170 Z"/>
    </path>
  </g>
  <rect x=".5" y=".5" width="1199" height="169" rx="18" fill="none" stroke="#30363d"/>

  <g class="up sans" text-anchor="middle">
    <text x="600" y="62" font-size="30" font-weight="800" fill="url(#txt)" filter="url(#glow)" textLength="380" lengthAdjust="spacingAndGlyphs">thanks for stopping by</text>
  </g>
  <g class="up mono" style="animation-delay:.35s" text-anchor="middle">
    <text x="600" y="92" font-size="14" fill="#8b949e" letter-spacing="1">vibe coding · AI agents · automation · say hi @itsGrizAi</text>
  </g>
</svg>
